<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Halcyon Collection</title>
<meta name="description" content="A private museum of digital gifts.">
<meta name="theme-color" content="#1d1914">
<style>
:root{--ink:#241d15;--ivory:#f1e9d7;--brz:#a98a4f;--brz-hi:#d6b877;--wal:#4a3122;--wal-d:#251710;--char:#242120;--nav:64px;
--serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--w1:#a99d86;--w2:#8c8069;--sp:rgba(255,232,178,.6)}
body[data-room=digital]{--w1:#9aa090;--w2:#7b8273}
body[data-room=written]{--w1:#ad9878;--w2:#8f7a5c}
body[data-room=photos]{--w1:#a89690;--w2:#8a7873}
body[data-room=special]{--w1:#939aa6;--w2:#747c89}
body[data-room=archive]{--w1:#efe8d8;--w2:#e3dac5}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;max-width:100%;overflow-x:clip;background:#1d1914}
body{font:16px/1.55 var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:3px solid var(--brz-hi);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:8px;top:-80px;z-index:400;background:var(--ivory);padding:12px 16px}.skip:focus{top:8px}
.cap-s{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase}

/* ---- rooms ---- */
#app{min-height:100dvh;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 8px)}
.room{display:none;min-height:100dvh;background:linear-gradient(var(--w1),var(--w2))}
.room.on{display:block}
.rhead{padding:calc(36px + env(safe-area-inset-top)) 22px 26px;text-align:center;background:radial-gradient(ellipse 80% 90% at 50% 0,rgba(255,236,190,.35),transparent 70%)}
.rhead .cap-s{margin:0 0 8px;color:#4b3a1c}
.rhead h2{font:500 clamp(2rem,9vw,3.2rem)/1.08 var(--serif);margin:0 0 12px;text-wrap:balance}
.rhead h2:focus{outline:none}
.rhead p.wt{font:italic 1.2rem/1.45 var(--serif);max-width:30em;margin:0 auto;color:#3a2f21}
.rhead i{display:block;width:90px;height:1px;margin:18px auto 0;background:var(--brz);box-shadow:0 1px 0 rgba(255,255,255,.4)}

/* ---- bay: one wall segment with its floor ---- */
.bay{position:relative;display:flex;flex-direction:column;align-items:center;padding:56px 16px 0;margin-top:-1px;
 background:radial-gradient(ellipse 75% 50% at 50% 24%,var(--sp),transparent 72%),linear-gradient(90deg,rgba(0,0,0,.3),transparent 13%,transparent 87%,rgba(0,0,0,.3)),linear-gradient(var(--w1),var(--w2));
 border-top:1px solid rgba(0,0,0,.18)}
.bay::before{content:"";position:absolute;inset:0 0 auto;height:46px;background:linear-gradient(rgba(0,0,0,.38),transparent);pointer-events:none}
.track{position:absolute;top:0;left:50%;width:46px;height:8px;margin-left:-23px;border-radius:0 0 6px 6px;background:linear-gradient(#d6b877,#6d531f);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.cone{position:absolute;top:8px;left:12%;right:12%;bottom:30px;clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);background:linear-gradient(rgba(255,230,170,.26),rgba(255,230,170,0) 85%);pointer-events:none}
.floor{position:relative;z-index:0;align-self:stretch;margin:-16px -16px 0;height:60px;
 background:linear-gradient(#cfc5b0 0 7px,#9d927c 7px 9px,transparent 9px),repeating-linear-gradient(90deg,transparent 0 83px,rgba(0,0,0,.28) 83px 84px),linear-gradient(#6b4a33,#3a2518 70%,#2a1a11);
 box-shadow:inset 0 14px 16px -10px rgba(0,0,0,.55)}
.ex{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;padding:0;border:0;background:none;text-align:left}
.ex:active{filter:brightness(1.05)}

/* frames & art */
.hang{position:relative;width:min(100%,520px)}
.hang.l{width:min(100%,560px)}
.plight{position:absolute;z-index:3;left:50%;top:-14px;width:44%;height:6px;margin-left:-22%;border-radius:3px;background:linear-gradient(#d6b877,#6d531f);box-shadow:0 0 16px 3px rgba(255,226,160,.5)}
.frame{position:relative;padding:var(--fw,12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 4px rgba(0,0,0,.55),0 22px 26px -14px rgba(0,0,0,.75),0 6px 10px rgba(0,0,0,.4)}
.f-wood{--fw:clamp(10px,3vw,16px);background:linear-gradient(135deg,#70503a,#38241a 45%,#5d412d 70%,#2e1d14)}
.f-gold{--fw:clamp(10px,3vw,16px);background:linear-gradient(135deg,#e0c585,#8c7236 38%,#d2b36b 60%,#765f27)}
.f-black{--fw:8px;background:linear-gradient(135deg,#2c2a28,#0e0d0c 50%,#232120);box-shadow:inset 0 0 0 1px #7a6129,0 22px 26px -14px rgba(0,0,0,.75),0 6px 10px rgba(0,0,0,.4)}
.mat{padding:clamp(12px,4vw,24px);background:linear-gradient(#f1eadb,#e4dac5);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),inset 2px 3px 7px rgba(0,0,0,.3)}
.f-black .mat{padding:0;background:#0e0d0c;box-shadow:none}
.art{position:relative;overflow:hidden;background:#cfc6b3;aspect-ratio:var(--ar,4/3);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.art::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.14),transparent 40%,transparent 72%,rgba(255,255,255,.06))}
.art>img{width:100%;height:100%;object-fit:cover}
.art.artifact{aspect-ratio:auto;background:#14120f;color:#d9cfba}
.art.artifact svg{width:100%;height:auto}
.ped,.vit,.hang,.pq,.shaft,.ped__art{display:block}
.ex>.pq{margin-bottom:36px}
.dbody{min-height:0}
.artifact__bar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#24211e;font:500 .72rem/1 ui-monospace,Menlo,Consolas,monospace;color:#b3a993;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artifact__bar i{width:7px;height:7px;border-radius:50%;background:var(--brz);flex:none}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center;color:#5d5444;background:repeating-linear-gradient(45deg,#d8cfbc 0 10px,#d1c7b3 10px 20px);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase}
.ph b{font:500 1.2rem var(--serif);letter-spacing:.02em;text-transform:none}

/* plaques */
.pq{position:relative;width:min(100%,340px);margin-top:20px;padding:12px 18px 14px;background:linear-gradient(#efe7d5,#ddd2ba);color:#2a2520;border:1px solid rgba(0,0,0,.22);box-shadow:inset 0 1px 0 #fff9,0 6px 12px rgba(0,0,0,.45)}
.pq::before,.pq::after{content:"";position:absolute;top:50%;width:4px;height:4px;border-radius:50%;background:#7d6935}.pq::before{left:6px}.pq::after{right:6px}
.pq small{display:block;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#5f4d22}
.pq h3{margin:2px 0 0;font:600 1.3rem/1.15 var(--serif)}
.pq .m{margin:4px 0 0;font-size:.8rem;color:#4d443a}
.pq .d{margin:8px 0 0;font-size:.88rem;line-height:1.45;color:#38322a;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pq.tag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78%;margin:0;padding:8px 10px;text-align:center}
.pq.tag::before,.pq.tag::after{display:none}
.pq.tag h3{font-size:1.05rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pq.tag .m{margin:2px 0 0;font-size:.72rem}

/* podium */
.ped{--pw:min(88vw,340px);--sw:82%;--sh:132px;--s1:#5a5551;--s2:#1f1d1b;position:relative;width:var(--pw)}
.ped.b{--s1:#f2ecde;--s2:#bdb29a;--sw:70%;--sh:150px}
.ped.c{--s1:#7a5a43;--s2:#2b1b12;--sw:88%;--sh:118px}
.ped__art{position:relative;z-index:2;width:88%;margin:0 auto -10px}
.ped__art::after{content:"";position:absolute;left:4%;right:4%;bottom:-7px;height:12px;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);z-index:-1}
.ped .tp{display:block;height:15px;clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);background:linear-gradient(#fff3,#0003),var(--s1)}
.ped .fr{display:block;height:14px;background:linear-gradient(90deg,#0004,#fff2 20%,#0000 60%,#0005),var(--s1);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 5px 7px rgba(0,0,0,.35)}
.ped .shaft{position:relative;width:var(--sw);height:var(--sh);margin:0 auto;background:linear-gradient(90deg,#0006,#fff1 14%,#0000 45%,#0004 82%,#0007),linear-gradient(var(--s1),var(--s2));box-shadow:inset 0 12px 12px -8px rgba(0,0,0,.5)}
.ped .base .fr{height:20px}
.ped::after{content:"";position:absolute;left:-5%;right:-5%;bottom:-9px;height:18px;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%)}
.ped .base{position:relative;z-index:1}

/* vitrine */
.vit{position:relative;width:min(92vw,360px)}
.vit__top{position:relative;height:150px}
.vit__plane{position:absolute;left:0;right:0;bottom:0;height:230px;transform:perspective(620px) rotateX(54deg);transform-origin:50% 100%;padding:12px;background:linear-gradient(135deg,#70503a,#38241a);border-radius:2px;box-shadow:0 0 0 2px #a98a4f}
.paper{position:relative;height:100%;padding:16px 18px;overflow:hidden;background:linear-gradient(#f0e8d6,#e5dcc6);color:#2b251f}
.paper::before{content:"";position:absolute;inset:7px;border:1px solid rgba(122,97,41,.4)}
.paper small{display:block;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#6e5214;margin-bottom:6px}
.paper h3{margin:0 0 8px;font:600 1.35rem/1.1 var(--serif)}
.paper p{margin:0;font:italic 1.05rem/1.55 var(--serif);color:#4a4136;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vit__plane::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.2),transparent 35%,transparent 65%,rgba(255,255,255,.1));pointer-events:none}
.vit__front{position:relative;height:104px;margin:0 2%;background:linear-gradient(90deg,#0006,#fff1 14%,#0000 50%,#0006),linear-gradient(#6a4a35,#2b1b12);box-shadow:inset 0 2px 0 #a98a4f,0 6px 10px rgba(0,0,0,.4)}
.vit__legs{display:flex;justify-content:space-between;margin:0 7%;height:22px}
.vit__legs i{width:16px;background:linear-gradient(90deg,#1a100a,#5a3d2b,#1a100a)}
.vit::after{content:"";position:absolute;left:-2%;right:-2%;bottom:-8px;height:16px;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%)}

.rfoot{display:flex;justify-content:center;padding:34px 16px 48px;background:#2b1b12}
.next{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;border:1px solid var(--brz-hi);color:var(--ivory);text-decoration:none;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.next:active{background:rgba(214,184,119,.2)}
.empty-room{padding:60px 20px;text-align:center;font:italic 1.3rem var(--serif)}

/* ---- entrance ---- */
.room--entrance{background:radial-gradient(ellipse 70% 50% at 50% 55%,rgba(255,200,130,.22),transparent 70%),linear-gradient(#2a241d,#14110d);color:var(--ivory)}
.hall{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(34px + env(safe-area-inset-top)) 20px calc(26px + env(safe-area-inset-bottom));text-align:center}
.hall .cap-s{margin:0 0 10px;color:var(--brz-hi)}
.hall h1{font:500 clamp(2.4rem,11vw,4.4rem)/1.02 var(--serif);margin:0 0 12px;text-wrap:balance}
.hall h1:focus{outline:none}
.hall .ins{font:italic 1.25rem/1.45 var(--serif);color:#d9cdb5;margin:0 auto;max-width:24em}
.enter{display:flex;align-items:center;justify-content:center;width:min(100%,340px);min-height:56px;background:var(--brz-hi);color:#1d1914;text-decoration:none;font-weight:600;font-size:.82rem;letter-spacing:.18em;text-transform:uppercase}
.enter:active{background:var(--ivory)}
.hall .pur{margin:14px 0 0;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:#c9bda5}

/* ---- archive ---- */
.archive{max-width:880px;margin:0 auto;padding:0 18px 36px}
.tools{display:grid;gap:14px;padding-bottom:18px;border-bottom:1px solid rgba(36,29,21,.4)}
.tools label{display:block;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.tools input,.tools select{width:100%;min-height:48px;padding:0 14px;background:#faf6ea;border:1px solid #7b705f;color:var(--ink);font:inherit;font-size:1rem;border-radius:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 16px;background:none;border:1px solid #7b705f;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.chip[aria-pressed=true]{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.count{margin:14px 0 0;font-size:.85rem}
.index{list-style:none;margin:6px 0 0;padding:0}
.row{display:block;width:100%;min-height:64px;text-align:left;padding:16px 4px;background:none;border:0;border-bottom:1px solid rgba(36,29,21,.25)}
.row:active{background:rgba(169,138,79,.18)}
.row__no,.row__type,.row__date{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:#5a4a26}
.row__date::before,.row__type::before{content:" · "}.row__no+span{display:block}
.row__title{display:block;font:600 1.45rem/1.2 var(--serif)}
.row__desc{display:block;font-size:.9rem;color:#4b4234;margin:3px 0 5px;line-height:1.45}
.ph-tag{margin-left:8px;padding:1px 7px;border:1px solid #7b705f;font:.65rem var(--sans);letter-spacing:.12em;text-transform:uppercase;vertical-align:middle}
.empty{text-align:center;padding:50px 10px;list-style:none}.empty svg{width:90px;margin:0 auto 14px;color:#7b705f}
.empty h3{font:500 1.7rem var(--serif);margin:0 0 6px}.empty button{margin-top:12px;min-height:48px;padding:0 20px;background:none;border:1px solid var(--ink);letter-spacing:.12em;text-transform:uppercase;font-size:.78rem}

/* ---- bottom navigation ---- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:100;display:grid;grid-template-columns:1fr 1.7fr 1fr;height:calc(var(--nav) + env(safe-area-inset-bottom));padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:linear-gradient(#2e2218,#1b120c);border-top:2px solid var(--brz);box-shadow:0 -8px 20px rgba(0,0,0,.4)}
.bar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--nav);background:none;border:0;color:var(--ivory);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
.bar button+button{border-left:1px solid rgba(169,138,79,.3)}
.bar button:active{background:rgba(214,184,119,.15)}
.bar b{font:500 1.02rem/1.1 var(--serif);text-transform:none;letter-spacing:.02em;color:var(--brz-hi);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.bar svg{width:20px;height:20px}
body[data-room=entrance] .bar{display:none}
body[data-room=entrance] #app{padding-bottom:0}

/* ---- sheets: directory, detail, lightbox ---- */
.sheet{position:fixed;inset:0;z-index:200;display:none;opacity:0;transition:opacity .22s}
.sheet.open{display:flex}.sheet.show{opacity:1}
#dir{align-items:flex-end;background:rgba(10,7,5,.7)}
.dirbox{width:100%;max-height:86dvh;overflow:auto;overscroll-behavior:contain;padding:22px 20px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(#2e2218,#1b120c);color:var(--ivory);border-top:2px solid var(--brz);transform:translateY(16px);transition:transform .25s}
#dir.show .dirbox{transform:none}
.dirbox h2{font:500 1.5rem var(--serif);margin:0 0 4px}
.dirbox ol{list-style:none;margin:0 0 14px;padding:0}
.dirbox ol a{display:flex;align-items:baseline;gap:14px;min-height:56px;padding:10px 0;border-bottom:1px solid rgba(169,138,79,.3);text-decoration:none;font:500 1.35rem var(--serif)}
.dirbox ol a small{width:2.6em;font:.75rem var(--sans);letter-spacing:.16em;color:var(--brz-hi)}
.dirbox ol a[aria-current]{color:var(--brz-hi)}
.snd{display:flex;gap:8px}
.snd button,.dclose{flex:1;min-height:48px;background:none;border:1px solid rgba(169,138,79,.6);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.snd button[aria-pressed=true]{color:var(--brz-hi)}
#det{flex-direction:column;background:radial-gradient(ellipse 90% 40% at 50% 0,rgba(255,226,160,.28),transparent 70%),linear-gradient(#352a20,#17110c);color:var(--ivory)}
.dbody{flex:1;overflow:auto;overscroll-behavior:contain;padding:calc(22px + env(safe-area-inset-top)) 20px 24px}
.dwrap{max-width:560px;margin:0 auto}
.dmedia{display:block;width:100%;padding:0;border:0;background:none;margin-bottom:22px}
.dmedia .hang{width:100%}
.dwrap .cap-s{margin:0 0 6px;color:var(--brz-hi)}
.dwrap h2{font:500 clamp(2rem,8vw,2.8rem)/1.08 var(--serif);margin:0 0 12px}.dwrap h2:focus{outline:none}
.dwrap .desc{margin:0 0 18px;color:#e2d7c0}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 18px;padding:14px 0;border-block:1px solid rgba(169,138,79,.4);font-size:.9rem}
.meta dt{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--brz-hi)}.meta dd{margin:0}
.note{margin:0 0 18px;padding-left:16px;border-left:2px solid var(--brz);font:italic 1.2rem/1.55 var(--serif)}
.reading{font:1.28rem/1.9 var(--serif);margin:0 0 20px;padding:20px;background:linear-gradient(#f0e8d6,#e5dcc6);color:#2b251f;box-shadow:0 8px 20px rgba(0,0,0,.5)}.reading p{margin:0 0 1em}.reading p:last-child{margin:0}
.nolink{padding:12px;border:1px dashed rgba(214,184,119,.6);font-size:.9rem}
.prov{font-style:italic;font-size:.9rem;color:#d4c8af}
.dbar{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#2e2218,#1b120c);border-top:2px solid var(--brz)}
.dbar button,.dbar a{display:flex;align-items:center;justify-content:center;min-height:52px;border:1px solid rgba(169,138,79,.6);background:none;text-decoration:none;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.dbar button:disabled{opacity:.3}
.dbar .go{background:var(--brz-hi);color:#1d1914;font-weight:600;border-color:var(--brz-hi)}
.dbar .row2{grid-column:1/-1;display:grid;grid-template-columns:56px 1fr 56px;gap:8px}
.dbar .row2 .dclose{grid-column:2}
#lb{align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(6,5,4,.97);padding:16px}
#lb img{max-width:100%;max-height:78dvh;object-fit:contain}
#lb p{margin:0;font:italic 1.1rem var(--serif);color:#d9cdb5;text-align:center}
#lb button{min-height:52px;padding:0 28px;background:none;border:1px solid var(--brz);color:var(--ivory);letter-spacing:.12em;text-transform:uppercase;font-size:.78rem}
.dim{position:fixed;inset:0;z-index:150;background:#120d09;opacity:0;pointer-events:none;transition:opacity .2s}.dim.on{opacity:1}

@media (min-width:760px){
 .bay{padding-top:70px}.hang{width:min(100%,560px)}.ped{--pw:360px}
 .bar{left:50%;right:auto;width:560px;transform:translateX(-50%);border:2px solid var(--brz);border-bottom:0}
 .tools{grid-template-columns:1fr 240px}.chips{grid-column:1/-1}
}
@media (orientation:landscape) and (max-height:520px){
 .hall{flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:center;gap:8px 28px}.fa{height:46dvh;margin:0}.bar b{font-size:.9rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* =====================================================================
   MAIN GALLERY ADDITIONS — hall guide + "from gallery" brass tags
   ===================================================================== */
.hg{max-width:560px;margin:0 auto;padding:6px 18px 40px}
.hg__box{position:relative;padding:18px 18px 8px;background:linear-gradient(#efe7d5,#ddd2ba);color:#2a2520;border:1px solid rgba(0,0,0,.22);box-shadow:inset 0 1px 0 #fff9,0 8px 16px rgba(0,0,0,.4)}
.hg__box::before{content:"";position:absolute;inset:6px;border:1px solid rgba(122,97,41,.45);pointer-events:none}
.hg__box .cap-s{margin:0 0 2px;color:#5f4d22;text-align:center}
.hg__box h3{margin:0 0 8px;font:600 1.35rem/1.15 var(--serif);text-align:center}
.hg ol{list-style:none;margin:0;padding:0}

 background:linear-gradient(#a98a4f 0 1px,#5a3d2b 1px 5px,rgba(0,0,0,.4) 5px 6px,transparent 6px),repeating-linear-gradient(90deg,rgba(0,0,0,.2) 0 1px,rgba(255,255,255,.05) 1px 2px,transparent 2px 120px),linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.34))}

    text: "Twenty-one moons have crowned our sky, Yet still my heart forgets how to lie; It beats your name with every chime, As though your soul invented time.\n\nBefore your love, the stars were stone, The night was vast, but I alone. Then softly came your gentle flame, And darkness never looked the same.\n\nThe dawn now wears your golden hue, The wind remembers speaking you. Each river hums your quiet grace, Each flower borrows from your face.\n\nI searched for peace in distant lands, In empty words and open hands. Yet every road, however far, Led home to where your heartbeat are.\n\nThe moon may fade, the oceans sleep, The mountains bow, the valleys weep. The years may steal my youthful fire, But never touch my heart's desire.\n\nFor love is not a passing breeze, Nor leaves that fall from autumn trees. It is the oak that grips the earth, Growing stronger through its hurt.\n\nWe've seen the days the heavens cried, When hope itself had nearly died. Yet hand in hand we crossed the rain, And found the sun beyond the pain.\n\nIf sorrow knocks upon our door, We'll build our joy a little more. For every scar the seasons leave Makes stronger hearts that still believe.\n\nYou are the calm my storms obey, The north that guides my soul astray. The prayer I never knew I'd prayed, The light that taught my fears to fade.\n\nIf I possessed the poet's tongue, Whose verses every age has sung, I'd still fall short, I'd still confess, Your worth exceeds my craftfulness.\n\nFor how can ink contain the sea? Or silence cage infinity? How shall mere letters hope to prove The endless architecture of love?\n\nSo let the constellations gleam, Let kingdoms vanish like a dream. While stars are born and worlds depart, You'll still be sovereign of my heart.\n\nTwenty-one months a fleeting phrase, Yet endless in its woven days. For every month became a thread, In every dream our souls have spread.\n\nAnd should the heavens ask of me What earthly gift eternity Had placed within these mortal years, I'd answer through delighted tears:\n\nIt wasn't fortune. It wasn't fame. It wasn't glory, Nor a name.\n\nIt was a girl whose loving gaze Turned ordinary nights to blaze. A soul so gentle, fierce, and true My greatest miracle was you.\n\nSo here's my vow while stars remain, Through every laughter, every pain: Until my final breath is through, My heart shall only beat for you.\n\nHappy twenty-first month, my love. May twenty-one become two hundred, And when our hair has turned to snow, I'll still look at you as I do now As the most beautiful miracle God ever let me know.",

/* =====================================================================

   ===================================================================== */
const wingRooms = () => ROOMS.filter(r => r.wing);
const wingOf = e => wingRooms().find(r => e.rooms.includes(r.id)) || null;
function curateMain() {
  const out = [], add = e => { if (e && !out.includes(e)) out.push(e); };
  EX.filter(e => e.rooms.includes("main")).forEach(add);                 /* 1. hung here by hand: room:"main" */
  EX.filter(e => e.featured && !e.placeholder).forEach(add);             /* 2. featured works that really exist */
  wingRooms().forEach(w => {                                             /* 3. any gallery still unrepresented */
    if (out.some(e => e.rooms.includes(w.id))) return;
    const pool = EX.filter(e => e.rooms.includes(w.id));
    add(pool.find(e => !e.placeholder) || pool[0]);
  });
  const rank = e => { const w = wingOf(e); return w ? wingRooms().indexOf(w) : 99; };
  return out.sort((x, y) => rank(x) - rank(y) || x.index - y.index);
}

/* ---- optional ambient sound (never autoplays) ---- */
const snd = { ctx: null, master: null, playing: false, muted: false, timer: null };
const playBtn = document.getElementById("snd-play"), muteBtn = document.getElementById("snd-mute");
function buildSnd() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
  const c = new AC(); const master = c.createGain(); master.gain.value = 0;
  const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 620; lp.connect(master); master.connect(c.destination);
  [110, 164.81, 220, 277.18, 329.63].forEach((f, i) => {
    const o = c.createOscillator(); o.type = "sine"; o.frequency.value = f; o.detune.value = (i - 2) * 4;
    const g = c.createGain(); g.gain.value = 0.05;
    const l = c.createOscillator(); l.frequency.value = 0.04 + i * 0.017; const lg = c.createGain(); lg.gain.value = 0.03; l.connect(lg); lg.connect(g.gain);
    o.connect(g); g.connect(lp); o.start(); l.start();
  });
  snd.ctx = c; snd.master = master; return true;
}
function applySound() {
  if (!snd.ctx) return;
  clearTimeout(snd.timer);
  const on = snd.playing && !snd.muted;
  snd.master.gain.setTargetAtTime(on ? 0.45 : 0, snd.ctx.currentTime, 0.6);
  if (!snd.playing) snd.timer = setTimeout(() => snd.ctx && snd.ctx.suspend(), 1800);
}
playBtn.addEventListener("click", () => {
  if (!snd.ctx && !buildSnd()) { playBtn.textContent = "Sound unavailable"; playBtn.disabled = true; return; }
  snd.playing = !snd.playing;
  if (snd.playing) { snd.ctx.resume(); gramPause(); }
  playBtn.setAttribute("aria-pressed", String(snd.playing));
  playBtn.textContent = snd.playing ? "Pause ambience" : "Play ambience";
  applySound();
});
muteBtn.addEventListener("click", () => { snd.muted = !snd.muted; muteBtn.setAttribute("aria-pressed", String(snd.muted)); muteBtn.textContent = snd.muted ? "Unmute" : "Mute"; applySound(); });
